<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Clover Sentence Export</title>

<style>
body{
  font-size:12px;
  font-family:Arial,sans-serif;
  margin:0;
  padding:10px;
}

button{
  margin:5px 0;
  padding:8px;
  width:100%;
}

textarea{
  width:100%;
  height:70vh;
  font-size:12px;
}
</style>
</head>

<body>

<h3>♣ Clover Sentence Export</h3>

<button onclick="loadData()">Load Clover Sentences</button>
<button onclick="copyText()">Copy All</button>

<textarea id="output" placeholder="sentences will appear here..."></textarea>

<script>

function loadData(){

  const raw = JSON.parse(
    localStorage.getItem('quiz_system_v22_final') || '{}'
  );

  const wrongCounts = raw.wrongCounts || {};
  const quizStack = raw.quizStack || [];

  // ♣ 1개 이상 main 목록
  const mains = Object.entries(wrongCounts)
    .filter(([_, count]) => count >= 1)
    .map(([main]) => main);

  // sentence 추출
  let sentences = quizStack
    .filter(q => mains.includes(q.main))
    .map(q => q.sentence || q.main || '')
    .filter(Boolean);

  // 중복 제거
  sentences = [...new Set(sentences)];

  document.getElementById('output').value =
    sentences.join('\n');

}

function copyText(){

  const ta = document.getElementById('output');

  ta.select();

  document.execCommand('copy');

  alert('copied');

}

</script>

</body>
</html>
