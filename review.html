<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Confused Sentence Export</title>
<style>
body {
  font-size: 12px;
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 10px;
}
button {
  margin: 5px 0;
  padding: 8px;
  width: 100%;
}
textarea {
  width: 100%;
  height: 70vh;
  font-size: 12px;
}
</style>
</head>
<body>

<h3>Confused Sentence Export Tool</h3>
<button onclick="loadData()">Load from localStorage</button>
<button onclick="copyText()">Copy All</button>

<textarea id="output" placeholder="data will appear here..."></textarea>

<script>
function loadData() {
  const raw = JSON.parse(localStorage.getItem('quiz_system_v22_final') || '{}');
  const quizStack = raw.quizStack || [];

  let sentences = quizStack.map(q => q.sentence || q.main || '').filter(Boolean);

  // remove duplicates
  sentences = [...new Set(sentences)];

  document.getElementById('output').value = sentences.join('\n');
}

function copyText() {
  const ta = document.getElementById('output');
  ta.select();
  document.execCommand('copy');
  alert('copied');
}
</script>

</body>
</html>
