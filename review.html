<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>햇갈려 리스트 - 투운사 시험문제은행</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .review-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .review-item {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .review-item h3 {
            margin-top: 0;
            color: #d9534f;
        }
        .review-item p {
            margin: 10px 0;
        }
        .no-items {
            text-align: center;
            color: #666;
            font-size: 18px;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <div class="review-container">
        <h1>햇갈려 리스트 (햇갈려ㅠㅠ 체크된 문제들)</h1>
        <div id="review-list"></div>
    </div>

    <script type="module">
        import { que } from './card_data.js';

        const CONFUSED_KEY = 'quiz_confused_list';
        const confusedSet = new Set(JSON.parse(localStorage.getItem(CONFUSED_KEY) || '[]'));

        const reviewList = document.getElementById('review-list');

        if (confusedSet.size === 0) {
            reviewList.innerHTML = '<p class="no-items">아직 햇갈려 체크된 문제가 없습니다. 📚</p>';
        } else {
            const sentences = Array.from(confusedSet).map(main => {
                const item = que.find(q => q.main === main);
                return item ? item.sentence : main;
            }).filter(Boolean);
            
            const textarea = document.createElement('textarea');
            textarea.readOnly = true;
            textarea.style.cssText = 'width:100%; height:300px; padding:10px; font-family:monospace; font-size:14px; border:1px solid #ddd; border-radius:5px; background:#fff;';
            textarea.value = sentences.join('\n\n');
            
            const copyBtn = document.createElement('button');
            copyBtn.textContent = '전체 복사';
            copyBtn.style.cssText = 'margin-top:10px; width:100%; padding:8px; background:#ffb547; color:white; border:none; border-radius:5px; cursor:pointer;';
            copyBtn.onclick = () => {
                textarea.select();
                document.execCommand('copy');
                copyBtn.textContent = '복사되었습니다!';
                setTimeout(() => copyBtn.textContent = '전체 복사', 2000);
            };
            
            reviewList.appendChild(textarea);
            reviewList.appendChild(copyBtn);
        }
    </script>
</body>
</html>
